name: Report an issue (English)
description: Report clipped text, untranslated dialogue or a game issue.
title: "[Issue] "
body:
  - type: input
    id: version
    attributes:
      label: Translation version
      description: Check VERSAO.txt, or say unknown.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and game edition
      description: Console or emulator, Title ID and official game update if known.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happened and where?
      description: Include character, location, text and expected behavior.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and reproduction steps
      description: Show the whole box and next page if needed. No game files, keys or personal saves.
